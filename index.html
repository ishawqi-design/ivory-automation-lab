<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر الأتمتة التشغيلية — ايفوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>:root{--bur:#7A2E2E;--bur2:#5e2121;--gold:#C9A961;--gold2:#a88a45;--ink:#2a2220;--mut:#7d716a;--line:#e6ddd2;--paper:#faf7f2;--soft:#f3ece2;--ok:#2f7d4f;--warn:#b7791f;--clay:#D97757}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Almarai','Tahoma',sans-serif;font-size:15.5px;line-height:1.7;direction:rtl}
button,select,input,textarea{font-family:inherit;font-size:inherit}
a{color:var(--bur)}
main{max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 18px;background:linear-gradient(120deg,var(--bur2),var(--bur));color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand .claude{color:#f4c3ad;letter-spacing:.3px}.brand .sep{width:1px;height:22px;background:rgba(255,255,255,.35)}
.brand .ivory{font-size:19px;color:var(--gold)}.brand .tag{font-size:11.5px;opacity:.75;font-weight:400}
.ttl{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:220px}.ttl b{font-size:15px}.ttl small{opacity:.75;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:20px;font-size:13.5px;opacity:.85}
nav a.on{background:var(--gold);color:var(--bur2);opacity:1;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.top .chip{background:rgba(255,255,255,.14);color:#fff}.chip.ok{background:#e4f2e9;color:var(--ok)}.top .chip.ok{background:rgba(120,220,160,.2);color:#d6ffe4}
.chip.warn{background:#fff3dc;color:var(--warn)}.top .chip.warn{background:rgba(255,210,120,.2);color:#ffe9c2}
.sec{font-size:21px;color:var(--bur);margin:22px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{color:var(--bur);margin:0 0 6px;font-size:19px}h4{color:var(--bur);margin:18px 0 8px}
.mut{color:var(--mut)}.center{text-align:center}
.hero{background:radial-gradient(circle at 15% 20%,rgba(201,169,97,.25),transparent 45%),linear-gradient(135deg,#fff,var(--soft));border:1px solid var(--line);border-radius:22px;padding:34px 30px;margin-top:6px}
.hero h1{font-size:28px;line-height:1.45;margin:4px 0 8px;color:var(--bur2)}.kick{color:var(--gold2);font-weight:800;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.row.center{justify-content:center}
.b{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.b:hover{border-color:var(--gold)}.b.pri{background:var(--bur);border-color:var(--bur);color:#fff}.b.pri:hover{background:var(--bur2)}
.b.sec2{background:#fff8ea;border-color:var(--gold);color:var(--bur2)}.b.ghost{background:transparent}.b.lg{padding:12px 24px;font-size:16.5px}.b.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.days{grid-template-columns:1fr}}
.day{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.day.muted{opacity:.6}
.day-h{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:6px}.day-h b{color:var(--bur)}.day-h span{font-size:13px;color:var(--mut)}
.ag{display:grid;grid-template-columns:92px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.ag span{color:var(--gold2);font-weight:800;direction:ltr;text-align:right}.ag p{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:860px){.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.card p{margin:4px 0 0;font-size:14px;color:var(--mut)}
.stat{text-align:center}.stat b{font-size:26px;color:var(--bur);display:block}.stat small{color:var(--mut)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.panel.narrow{max-width:360px;margin:30px auto}
.panel.narrow input{width:100%;margin:10px 0;padding:10px;border:1.5px solid var(--line);border-radius:10px;text-align:center}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.st{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;color:var(--mut);white-space:nowrap;font-size:13.5px}
.st i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--bur);font-size:12px}
.st.on{border-color:var(--bur);color:var(--bur);background:#fff8f3}.st.on i{background:var(--bur);color:#fff}.st.done i{background:var(--ok);color:#fff}.st:disabled{opacity:.45;cursor:not-allowed}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin-top:10px}@media(max-width:760px){.form{grid-template-columns:1fr}}
.form label,.result label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px}.form label small{color:var(--mut);font-weight:400}
select,input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,97,.2)}
textarea{line-height:1.75;resize:vertical}
.form label:has(textarea){grid-column:1/-1}
.result{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff8ea;border:1px solid #efdcb0;border-radius:12px;padding:12px}
.hook .play{width:86px;height:86px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;background:var(--bur);color:#fff;font-size:34px}
.hook .q{background:var(--soft);border-radius:12px;padding:10px;max-width:640px;margin:14px auto 0}
.slide{background:linear-gradient(160deg,#fff,var(--soft));border:1px solid var(--line);border-radius:20px;padding:28px 34px;min-height:340px;position:relative}
.slide h3{font-size:26px}.slide ul{font-size:18px;line-height:2}.slide .key{background:var(--bur);color:#fff;display:inline-block;padding:8px 16px;border-radius:12px;font-weight:700}
.slide-n{position:absolute;left:20px;top:16px;color:var(--gold2);font-weight:800}
.dot{width:11px;height:11px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}.dot.on{background:var(--bur)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:900px){.tools{grid-template-columns:1fr}}
.tool{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px}.tool.done{border-color:#bfe0cb}
.tool-h{display:flex;gap:10px;align-items:center}.tool-h h4{margin:0}.tool-h small{color:var(--gold2);font-weight:700}.tool-h .chip{margin-inline-start:auto}
.ic{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.where{font-size:13px;color:var(--mut);background:var(--paper);border-radius:8px;padding:6px 10px}
.lbl{display:block;margin:10px 0 4px;color:var(--bur);font-size:13.5px}
.code{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fffdf9}.code-h{display:flex;justify-content:flex-end;padding:4px 6px;background:var(--soft)}
.code textarea{border:0;border-radius:0;font-size:13.5px;background:#fffdf9}
.tip{background:#f1f7f3;border-radius:10px;padding:8px 12px;margin:8px 0 0;font-size:13.5px}.tip.warn{background:#fff6e6}
.taskcard{text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.taskcard:hover{border-color:var(--gold)}.taskcard small{color:var(--gold2);font-weight:800}.taskcard b{color:var(--bur2);font-size:16px}
.bar{display:block;height:8px;background:var(--soft);border-radius:8px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--bur));border-radius:8px}.bar.sm{height:6px}
.crumb{font-size:13.5px;color:var(--mut);margin:14px 0 8px}
.prog{display:flex;gap:10px;align-items:center;margin:8px 0 14px}.prog b{color:var(--bur)}
.axis{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--paper)}
.axis-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}.axis-h b{color:var(--bur);font-size:16px}.axis-h span{font-size:13px;color:var(--mut)}
.q{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}.q.ans{border-color:#bfe0cb}
.q .qq{font-weight:800;color:var(--ink)}.q .why{font-size:12.5px;color:var(--mut);margin:1px 0 7px}.q input{margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chipb{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13.5px}.chipb.on{background:var(--bur);border-color:var(--bur);color:#fff}.chipb:hover{border-color:var(--gold)}
.edit{margin-top:12px}.edit-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}.edit-h .b{margin-inline-start:auto}
details.edit summary{cursor:pointer;font-weight:700;color:var(--bur);padding:6px 0}
.ws{display:grid;grid-template-columns:1fr 330px;gap:14px;margin-top:10px}@media(max-width:900px){.ws{grid-template-columns:1fr}}
.chatbox{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px;height:440px;overflow-y:auto}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;margin:8px 0;font-size:14.5px}.msg p{margin:0 0 4px}
.msg.me{background:var(--bur);color:#fff;margin-inline-start:auto;border-end-end-radius:4px}
.msg.ai{background:#fff;border:1px solid var(--line);border-end-start-radius:4px}.msg.sys{background:#fff3dc;margin:8px auto;text-align:center}
.ms{font-size:12px;font-weight:800;color:var(--gold2)}.mq{font-weight:800;color:var(--bur);margin-top:6px!important}.chg{margin:4px 0;padding-inline-start:18px;font-size:13px;color:var(--mut)}
.reply{display:flex;gap:8px;margin-top:8px}.reply textarea{flex:1}
.ws-side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.gauge{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.gauge>div{width:116px;height:116px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.gauge b{font-size:28px;color:var(--bur)}.gauge small{font-size:11.5px;color:var(--mut)}
.cr{display:grid;grid-template-columns:1fr 70px 28px;gap:6px;align-items:center;font-size:12.5px;margin:4px 0}.cr b{text-align:center}.crn{font-size:11.5px;color:var(--mut);margin:-2px 0 6px}
.sync,.vers{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;align-items:center}.sync b,.vers b{width:100%;color:var(--bur);font-size:13.5px}
.vb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer}.vb.on{border-color:var(--bur);color:var(--bur);font-weight:800}
.pass{background:#e8f5ec;border:1.5px solid #9fd1b0;border-radius:14px;padding:12px 16px;font-weight:700;color:var(--ok);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pack{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}@media(max-width:980px){.pack{grid-template-columns:1fr}}
.pk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.pk-h b{color:var(--bur)}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:10px;align-items:flex-start;text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
.ck i{font-style:normal;flex:0 0 22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff}.ck.on{border-color:#bfe0cb;background:#f4fbf6}.ck.on i{background:var(--ok);border-color:var(--ok)}
.relay{border:2px dashed var(--gold);background:#fffaf0;border-radius:14px;padding:14px;margin:12px 0}.relay b{color:var(--bur2)}.relay p{margin:4px 0 8px;font-size:14px}.relay textarea#relay-in{margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{background:var(--soft);color:var(--bur);text-align:center;padding:8px}.tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:right}
.busy{position:fixed;inset:0;background:rgba(42,34,32,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;color:#fff;font-weight:800}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:var(--gold);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;transition:.25s;z-index:60;opacity:0}#toast.on{transform:translateX(-50%);opacity:1}
footer{text-align:center;font-size:12.5px;color:var(--mut);padding:20px}
.rate b{white-space:nowrap;color:var(--bur);font-size:13.5px}.rate select{flex:1}
.film{width:100%;max-width:960px;aspect-ratio:16/9;border-radius:14px;background:#0b1530;display:block;margin:10px auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.mgrid{display:grid;gap:12px;margin:14px 0}.mgrid.g3{grid-template-columns:repeat(3,1fr)}.mgrid.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:860px){.mgrid.g3,.mgrid.g4{grid-template-columns:1fr 1fr}}
.mcard{background:#fff;border:1.5px solid var(--line);border-top:4px solid var(--bur);border-radius:14px;padding:14px}.mcard span{font-size:26px}.mcard b{display:block;color:var(--bur2);font-size:17px;margin:4px 0}.mcard p{margin:0;font-size:14.5px;color:var(--mut)}
.taskwrap.with-comp{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}@media(max-width:1000px){.taskwrap.with-comp{grid-template-columns:1fr}}
.taskmain{min-width:0}
.comp{position:sticky;top:76px;background:#fff;border:1.5px solid #e7cfca;border-radius:16px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 96px)}
.comp-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.comp-h b{color:var(--bur)}.comp-h small{flex:1 1 100%;color:var(--mut);font-size:12.5px;line-height:1.5}
.comp-body{flex:1;overflow-y:auto;min-height:180px;max-height:46vh;background:var(--paper);border-radius:12px;padding:8px}
.comp .msg{max-width:96%;font-size:14px}.comp .chips{margin:0}.comp .chipb{font-size:12.5px;padding:4px 10px}
.prop{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.prop-v{background:#fff8ea;border-radius:8px;padding:8px;font-size:13.5px;white-space:pre-wrap;margin-bottom:6px;max-height:160px;overflow:auto}
.qbtn{float:left;font-weight:400}.q.focus{border-color:var(--bur);box-shadow:0 0 0 3px rgba(122,46,46,.12)}
.mdout{border:1px solid var(--line);border-radius:12px;background:#fffdf9;padding:14px 18px;max-height:520px;overflow:auto}.mdout h3,.mdout h4,.mdout h5{color:var(--bur);margin:10px 0 6px}.mdout p{margin:6px 0}.mdout .tbl{margin:8px 0}
.xfer{background:#fff8ea;border:1.5px solid #efdcb0;border-radius:14px;padding:12px 16px;margin:10px 0}.xfer p{margin:6px 0}.xfer summary{cursor:pointer;font-weight:700;color:var(--bur)}
.refined-badge{background:var(--gold);color:#5a3800;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px;vertical-align:middle}
.approved-sum{background:#f0f7f1;border:1.5px solid #b8dfc0;border-radius:12px;padding:12px 14px;margin:12px 0}.approved-sum>b{display:block;color:#2f7d4f;font-size:14px;margin-bottom:8px}
.appr-item{margin:6px 0;padding:6px 10px;background:#fff;border-radius:8px;border-right:3px solid #2f7d4f}.appr-q{display:block;font-size:12.5px;color:var(--mut);margin-bottom:2px}.appr-a{display:block;font-size:14px;color:#1a1a1a;font-weight:500}
/* بطاقة المشارك */
.roster-card{background:#fff8ea;border:1.5px solid var(--gold);border-radius:12px;padding:12px 16px;margin:8px 0}
.rc-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0e8d4;font-size:14px}
.rc-row:last-child{border-bottom:none}.rc-row span{color:var(--mut)}.rc-row b{color:var(--bur2)}
/* اليوم الثالث */
.d3-secs{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.d3-sec{background:#fafafa;border:1.5px solid var(--line);border-radius:10px;padding:12px;transition:border-color .2s}
.d3-sec.done{border-color:#2f7d4f;background:#f0f7f1}
.d3-sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.d3-num{background:var(--bur);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.d3-sec.done .d3-num{background:#2f7d4f}
.d3-note{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13.5px;font-family:inherit;resize:vertical;direction:rtl}
.d3-sec-q{font-size:13px;margin:4px 0 6px;color:var(--mut)}
.d3-instr-ref{margin:10px 0;padding:10px;background:#fff8ea;border-radius:10px;border:1px solid #efdcb0}
.d3-manual{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.d3-manual-sec{background:#fafafa;border:1.5px solid var(--line);border-radius:10px;padding:12px}
.d3-pillar{border-radius:12px;overflow:hidden;border:2px solid var(--line);transition:border-color .2s}
.d3-pillar.filled{border-color:#2f7d4f}
.d3-pillar-h{width:100%;display:grid;grid-template-columns:36px 1fr auto 28px;align-items:center;gap:10px;padding:14px 16px;background:var(--pc,#7a2e2e);color:#fff;border:none;cursor:pointer;text-align:right;direction:rtl}
.d3-pnum{font-size:22px;font-weight:800;opacity:.9;text-align:center}
.d3-pillar-name{font-size:17px;font-weight:700}
.d3-pq{font-size:13px;opacity:.8;grid-column:2/3;margin-top:-4px}
.d3-pillar-h{grid-template-rows:auto auto}
.d3-pillar-h .d3-pnum{grid-row:1/3}.d3-pillar-h .d3-pillar-badge{grid-row:1/3}
.d3-pillar-badge{font-size:16px;text-align:center;opacity:.8}
.d3-pillar.filled .d3-pillar-badge{background:rgba(255,255,255,.25);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px}
.d3-pillar-body{padding:14px;display:flex;flex-direction:column;gap:10px;background:#fafafa}
.d3-why{background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;color:var(--mut);border-right:3px solid var(--gold)}
/* Wizard */
.wizard-wrap{display:flex;flex-direction:column;gap:14px}
.wizard-progress{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.wdot{width:32px;height:32px;border-radius:50%;background:#ddd;color:#888;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .2s;flex-shrink:0}
.wdot.active{background:var(--pc,var(--bur));color:#fff;transform:scale(1.15);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.wdot.done{background:#2f7d4f;color:#fff}
.wizard-label{flex:1;text-align:left;color:var(--mut);font-size:13px}
.wizard-card{border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.wizard-head{padding:18px 20px;color:#fff;display:flex;gap:14px;align-items:flex-start}

async function ask(prompt, opts = {}) {
  if (AI.mode === 'sample' && AI.sample) {
    const r = await AI.sample(prompt, { modelTier: opts.tier || 'default', cache: false });
    return r.text;
  }
  if (AI.mode === 'bridge' && CFG.bridgeUrl) {
    const r = await fetch(CFG.bridgeUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ prompt }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || typeof j.text !== 'string') { const e = new Error(j.error || 'bridge'); e.code = r.status === 429 ? 'rate_limited' : (j.error || 'bridge'); throw e; }
    return j.text;
  }
  const e = new Error('manual'); e.code = 'manual'; throw e;
}
function parseJSON(txt) {
  if (!txt) return null; let s = String(txt).trim();
  s = s.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
}

async function run(kind, prompt, handler, label) {

      if (e && e.code === 'rate_limited') { toast('ضغط مؤقت على كلود — انتظر دقيقة ثم أعد المحاولة'); render(); return; }
      if (e && e.code === 'not_granted') { AI.mode = 'manual'; toast('لم يُمنح الإذن — تحوّل المختبر إلى النقل اليدوي'); }
      else { toast('تعذّر الاتصال بكلود — استخدم النقل اليدوي'); }
    }
  }
  S.relay = { kind, prompt, label: label || '' };

}

function localScore(txt) {
  if (!txt) return 0; let s = 0;
  for (let i = 1; i <= 8; i++) if (txt.includes('⟦' + '١٢٣٤٥٦٧٨'[i - 1] + '⟧')) s += 7;
  if (!/لم يُجب/.test(txt)) s += 10;
  const holes = (txt.match(/\[يُستكمل\]/g) || []).length; s += Math.max(0, 12 - holes * 3);
  s += Math.min(22, Math.floor(txt.length / 120));
  return Math.min(88, s);
}

function compTurn(msg) {

function applyComp(t, txt) {
  const j = parseJSON(txt);
  if (!j) { t.comp.push({ role: 'ai', content: String(txt || '').trim().slice(0, 4000) || 'لم يصل رد.' }); return; }
  let pr = j.proposal && j.proposal.kind && j.proposal.value ? j.proposal : null;
  if (pr && pr.kind === 'answer' && !QS.some(q => q.id === pr.qid)) pr = null;
  t.comp.push({ role: 'ai', content: j.reply || '', proposal: pr });
}
function applyProposal(t, k) {
  const m = (t.comp || [])[k]; if (!m || !m.proposal) return; const pr = m.proposal;
  if (pr.kind === 'answer') { const q = QS.find(x => x.id === pr.qid); if (q.multi) { const a = Array.isArray(t.ans[q.id]) ? t.ans[q.id].slice() : []; if (!a.includes(OTHER)) a.push(OTHER); t.ans[q.id] = a; } else t.ans[q.id] = OTHER; t.other[q.id] = pr.value; }
  else if (pr.kind === 'deep') { const i = +pr.i || 0; t.deepAns[i] = OTHER; t.deepOther[i] = pr.value; }
  else if (pr.kind === 'title') {
    t.raw = pr.value; t.pick = OTHER; t.refined = true;
    m.applied = true; save(); render(); toast('اعتُمد — جاري توليد العنوان المهني…');
    run('phrase', P.phrase(t), txt => {
      const j = parseJSON(txt);
      if (j) { t.title = j.title || pr.value; t.output = j.output || ''; if (TYPES.some(x => x.k === j.type)) t.type = j.type; t.phraseNote = j.note || ''; }
      else { t.title = pr.value; }
      save(); render(); toast('اكتملت صياغة المهمة ✓');
    }, 'رفيقك يكمل الصياغة…');
    return;
  }
  else if (pr.kind === 'instr' && pr.value.length > 300) { t.instr = pr.value; t.versions.push({ text: t.instr, at: Date.now(), score: null, by: 'رفيقك Claude' }); syncLocal(t); if (AI.mode !== 'manual') setTimeout(() => autoSync(t), 50); }
  m.applied = true; save(); render(); toast('اعتُمد التعديل');
}
function reviewTurn(msg) {

function applyReview(t, txt) {
  const j = parseJSON(txt);
  if (!j || typeof j.score !== 'number') { t.chat.push({ role: 'sys', content: 'تعذّر قراءة رد المدقق — أعد الإرسال.' }); return; }
  const revised = (j.revised || '').trim();
  if (revised.length > 300) t.instr = revised;
  t.score = Math.max(0, Math.min(100, Math.round(j.score)));
  t.crit = (j.criteria || []).slice(0, 8).map((s, i) => ({ s: Math.round(+s || 0), n: (j.notes || [])[i] || '' }));
  t.versions.push({ text: t.instr, at: Date.now(), score: t.score, by: 'المدقق', changes: j.changes || [] });
  t.passed = t.score >= S.threshold;
  t.chat.push({ role: 'ai', content: j.message || '', q: t.passed ? '' : (j.question || ''), o: t.passed ? [] : (j.options || []).filter(Boolean).slice(0, 3), score: t.score, changes: j.changes || [] });
  syncLocal(t);
  if (AI.mode !== 'manual') setTimeout(() => autoSync(t), 50);
}

/* عرض Markdown مبسّط للمخرج التجريبي */
function md(src) {
  const L = String(src || '').split('\n'); let h = '', i = 0;
  const inl = x => esc(x).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  while (i < L.length) {
    const l = L[i];
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const row = x => x.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const hd = row(l); i += 2; const rows = []; while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(row(L[i++]));
      h += `<table class="tbl"><thead><tr>${hd.map(c => `<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; continue;
    }
    const m = l.match(/^(#{1,4})\s+(.*)/);
    if (m) h += `<h${Math.min(6, m[1].length + 2)}>${inl(m[2])}</h${Math.min(6, m[1].length + 2)}>`;
    else if (/^\s*[-*•]\s+/.test(l)) { h += '<ul>'; while (i < L.length && /^\s*[-*•]\s+/.test(L[i])) h += `<li>${inl(L[i++].replace(/^\s*[-*•]\s+/, ''))}</li>`; h += '</ul>'; continue; }
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
    i++;
  }
  return h;
}

    <p class="mut">اختر مهمتك الأولى وأدخل عليها هذا الموقف: حالة استثنائية حقيقية لم تُصمَّم لها التعليمات. شغّل Claude وراقب أين يتعثر.</p>
    <label>الاستثناء الذي ستختبره<textarea data-a="d3exc" rows="2" placeholder="مثال: وصل تقرير من إدارة X بأرقام مختلفة عن المصدر الأصلي…">${esc(S.d3exc || '')}</textarea></label>
    <label>ماذا حدث؟ أين تعثّر Claude؟<textarea data-a="d3fail" rows="2" placeholder="صِف بدقة ما أنتجه Claude وأين كان الخطأ أو النقص…">${esc(S.d3fail || '')}</textarea></label>
    <label>كيف أصلحت التعليمات؟<textarea data-a="d3fix" rows="2" placeholder="القسم الذي عدّلته، والإضافة التي أضفتها…">${esc(S.d3fix || '')}</textarea></label>
    <div class="row">${btn('d3-break-done', '✓ سجّل الإصلاح في تعليماتي', S.d3fixDone ? 'ghost' : 'pri')}${S.d3fixDone ? '<span class="chip ok">✓ سُجّل</span>' : ''}</div>
  </div>`;

  // ٤. خطة 30 يوماً
  const WEEKS = [
    ['الأسبوع الأول','أول تشغيل حقيقي للأداة على بيانات فعلية'],
    ['الأسبوع الثاني','راجع المخرج: هل احتاج تعديلاً في التعليمات؟'],
    ['الأسبوع الثالث','شارك الأداة مع زميل واجمع ملاحظاته'],
    ['الأسبوع الرابع','قس الوقت الفعلي الموفَّر وحدّث لوحة الأثر']
  ];
  const planRows = WEEKS.map(([w, desc], i) => {
    const k = 'd3plan' + i;
    const val = S.d3plan && S.d3plan[k] || '';
    return `<div class="d3-plan-row"><div class="d3-plan-label"><b>${esc(w)}</b><small>${esc(desc)}</small></div>
    <input type="text" data-a="d3plan" data-k="${k}" value="${esc(val)}" placeholder="التزامك المحدد…"></div>`;
  }).join('');

  return `<section><h2 class="sec">اليوم الثالث — من الأداة إلى المهارة</h2>

  ${!hasPack ? `<div class="panel"><p class="tip warn">⚠️ أكمل بناء مهمتك الأولى في اليوم الثاني أولاً، ثم عد هنا.</p></div>` : ''}

  <!-- المحطة الأولى: فكّ الأداة -->
  <div class="panel"><h3>① فكّ الأداة — اشرح تعليماتك قسماً قسماً</h3>
  <p class="mut">افتح تعليمات مهمتك الأولى وقرأ كل قسم بصوت عالٍ لزميلك — أو لنفسك. لكل قسم: ماذا يقول؟ ولماذا هو مهم؟ هل هو دقيق كفاية؟ من لا يستطيع الشرح لم يفهم البنية بعد.</p>
  ${hasPack ? `<div class="d3-instr-ref"><b>تعليماتك — للمرجع:</b>${codeBox('d3ref', t.instr, 6)}</div>` : ''}
  <div class="d3-secs">${breakRows}</div></div>

  <!-- المحطة الثانية: البناء اليدوي -->
  <div class="panel"><h3>② ابنِ أداة ثانية يدوياً</h3>
  <p class="mut">اختر مهمتك الثانية من اليوم الثاني. الآن اكتب تعليماتها بيدك — قسماً قسماً — من إجاباتك في الاستنطاق. <b>لا تضغط «اكتبها بكلود»</b>. كلود يراجع فقط في النهاية.</p>
  <div class="d3-manual">${MANUAL_SECTIONS}</div>
  ${checkList}
  <div class="row">${btn('d3-review-manual', '🔍 راجع كلود ما كتبته', allFilled ? 'pri' : 'ghost')}${btn('d3-save-manual', '💾 احفظ في مهمتي الثانية', 'ghost')}</div>
  ${relayBox('d3review')}</div>

  <!-- المحطة الثالثة: كسر وإصلاح -->
  <div class="panel"><h3>③ كسر وإصلاح — استثناء حقيقي تُشخّصه بنفسك</h3>
  ${breakPanel}</div>

  <!-- الختام: خطة 30 يوماً -->
  <div class="panel"><h3>④ خطة 30 يوماً — التزامك قبل المغادرة</h3>
  <p class="mut">لا تغادر إلا بأربعة التزامات محددة. الغموض عدو الممارسة.</p>
  <div class="d3-plan">${planRows}</div>
  <div class="navrow"><span></span>${btn('d3-finish', '🎓 أنهيت اليوم الثالث — احفظ خطتي', 'pri')}</div>
  ${S.d3done ? '<div class="pass">✓ أكملت البرنامج. خطتك محفوظة — وفّقك الله في تطبيقها.</div>' : ''}</div>

  </section>`;
}
function vTrainer() {
  if (!sessionTrainer) return `<section><div class="panel center narrow"><h3>🔐 لوحة المدرب</h3><input type="password" id="pin" inputmode="numeric" placeholder="الرمز">${btn('pin', 'دخول', 'pri')}</div></section>`;
  const rows = progressRows;
  return `<section><h2 class="sec">لوحة المدرب</h2><div class="grid3">
  <div class="card"><b>عتبة ورشة التدقيق</b>${sel('thr', ['90', '95', '98', '99'], String(S.threshold))}<p class="mut">تُطبق على هذا الجهاز؛ وتُضبط افتراضيًا في نسخة المشاركين.</p></div>
  <div class="card"><b>نمط الاتصال بكلود</b>${sel('mode', ['sample', 'bridge', 'manual'], AI.mode)}<p class="mut">sample: داخل المختبر بحساب المشارك · manual: نسخ ولصق.</p></div>
  <div class="card"><b>تصفير بيانات هذا الجهاز</b>${btn('reset', 'صفّر', 'ghost')}</div></div>
  <div class="panel"><h3>تقدم المشاركين</h3>${rows == null ? '<p class="mut">المتابعة الحية متاحة حين يعمل المختبر داخل Claude وتتاح قاعدة البيانات.</p>' : !rows.length ? '<p class="mut">لا بيانات بعد.</p>'
   : `<table class="tbl"><thead><tr><th>المشارك</th><th>الدور</th><th>أدوات اليوم الأول</th><th>المهمة ١</th><th>المهمة ٢</th><th>المهمة ٣</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.nick || '—')}</td><td>${esc(r.role || '')}</td><td>${AR_D(r.d1 || 0)}/٤</td>${(r.tasks || []).map(x => `<td>${STAGES[(x.st || 1) - 1]}${x.sc >= 0 ? ' · ' + AR_D(x.sc) + '٪' : ''}${x.ok ? ' ✓' : ''}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  ${btn('pin', '↻ تحديث', 'ghost')}</div></section>`;
}

/* ---------- الرسم والأحداث ---------- */
function render() {
  const r = route(); let v;
  if (r === 'day1') v = vDay1(); else if (r === 'day2') v = vDay2(); else if (r === 'task') v = vTask(); else if (r === 'day3') v = vDay3(); else if (r === 'trainer') v = vTrainer(); else v = vHome();
  const ae = document.activeElement; const keep = ae && ae.id && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT') ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd, v: ae.value } : null;
  $('#app').innerHTML = header() + `<main>${v}</main>` + (S.busy ? `<div class="busy"><div class="spin"></div><p>${esc(S.busy)}</p></div>` : '') +
    `<footer>ايفوري للتدريب والاستشارات · ivorytraining.com · <a href="#trainer">لوحة المدرب</a></footer><div id="toast"></div>`;
  if (keep) { const n = document.getElementById(keep.id); if (n && !n.readOnly) { n.value = keep.v; n.focus(); try { n.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  const cb = $('#chatbox'); if (cb) cb.scrollTop = cb.scrollHeight; const cp = $('#compbox'); if (cp) cp.scrollTop = cp.scrollHeight;
}
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return; e.preventDefault(); act(el.dataset.a, el); });
document.addEventListener('change', e => { const el = e.target; if (el.tagName !== 'SELECT' || !el.dataset.a) return;
  if (el.dataset.a === 'prof' && el.dataset.k === 'famn') { const f = FAMILIES.find(x => x.n === el.value); S.profile.fam = f ? f.k : ''; S.profile.title = ''; S.profile.titleOther = ''; save(); render(); return; }
  if (el.dataset.a === 'tfield' && el.dataset.k === 'typen') { const x = TYPES.find(y => y.n === el.value); T().type = x ? x.k : ''; save(); render(); return; }
  act(el.dataset.a, el); });
document.addEventListener('input', e => { const el = e.target; if (!el.dataset || !el.dataset.a || el.tagName === 'SELECT') return; act(el.dataset.a, el); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'reply') act('send', e.target); });
window.addEventListener('hashchange', () => { render(); scrollTop(); });
load(); render(); setTimeout(initPlatform, 0);

</script></body></html>
