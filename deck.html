<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>العرض — مهارة الأتمتة التشغيلية بالذكاء الاصطناعي — ايفوري</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>:root{--key:#7A2E2E;--key-deep:#5a1f1f;--key-soft:#f6ecea;--key-soft2:#e7cfca;--accent:#a8894e;
--ink:#231c1a;--ink2:#3d3431;--ink3:#6b5f5a;--muted:#8c817b;--line:#e7dfd6;--line2:#ddd2c6;--white:#fff;--bg:#fbf8f4;
--f-dis:'Almarai',Tahoma,sans-serif;--f-ar:'Almarai',Tahoma,sans-serif;--f-num:'Almarai',Tahoma,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#2a2321;overflow:hidden;font-family:var(--f-ar);direction:rtl}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);padding:90px 120px 120px;display:none;overflow:hidden;color:var(--ink)}
.slide.on{display:flex;flex-direction:column;justify-content:center}
.slide.on>.hero,.slide.on>.ayah,.slide.on>.stcover{flex:1}
.slide.dark{background:radial-gradient(circle at 30% 30%,#3a2523,#1d1515);color:#f3ece6}
.arcs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.arcs i{position:absolute;border-radius:50%;border:2px solid var(--key-soft2);opacity:.55}
.arcs i:nth-child(1){width:1100px;height:1100px;left:-520px;top:-560px}
.arcs i:nth-child(2){width:760px;height:760px;right:-360px;bottom:-420px;border-color:#eadbc6}
.arcs i:nth-child(3){width:420px;height:420px;right:-120px;bottom:-200px;border-color:var(--key-soft2)}
.wm{position:absolute;left:70px;bottom:90px;font-size:300px;line-height:1;color:var(--key);opacity:.05;font-weight:800;pointer-events:none}
.kicker{font-size:27px;font-weight:700;letter-spacing:.1em;color:var(--key)}
.title{font-family:var(--f-dis);font-size:64px;font-weight:800;line-height:1.2;margin:8px 0 14px;color:var(--ink)}
.lead{font-size:34px;line-height:1.6;color:var(--ink2);margin:0 0 26px;max-width:1500px}
.lead b,.cs b{color:var(--key-deep)}
.insight{font-size:31px;line-height:1.6;background:var(--key-soft);border-inline-start:8px solid var(--key);border-radius:14px;padding:18px 26px;color:var(--ink2)}
.insight .rl{font-weight:800;color:var(--key);margin-inline-end:12px}
.footnote{font-size:24px;color:var(--muted)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tag{font-size:26px;background:#fff;border:1.5px solid var(--line2);border-radius:40px;padding:8px 22px;color:var(--ink2)}
/* hero */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:6px;position:relative}
.hero .h-top{font-size:26px;font-weight:700;letter-spacing:.14em;color:var(--key-deep);margin-bottom:10px}
.hero .h-big{font-family:var(--f-dis);font-size:132px;font-weight:800;line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin:0}
.hero .h-sm{font-family:var(--f-dis);font-size:54px;font-weight:700;line-height:1.3;color:var(--ink3);margin:4px 0 0}
.hero .h-rule{width:120px;height:5px;border-radius:3px;background:var(--key);margin:26px 0 20px}
.hero .h-lead{font-size:32px;line-height:1.55;color:var(--ink2);max-width:1180px;margin:0}
.hero .h-lead b{color:var(--key-deep)}
.hero .h-by{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero .h-by .nm{font-family:var(--f-dis);font-size:38px;font-weight:800;color:var(--ink)}
.hero .h-by .rl2{font-size:26px;color:var(--ink3)}
.hero .h-org{margin-top:22px;font-size:24px;color:var(--muted);letter-spacing:.03em}
/* ayah */
.ayah{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:24px;position:relative}
.ayah .basm{font-size:44px;color:var(--key-deep);font-weight:700}
.ayah .vs{font-size:62px;font-weight:700;line-height:1.85;color:var(--ink);max-width:1500px}
.ayah .src{font-size:26px;color:var(--muted);letter-spacing:.05em}
.ayah .ay-lead{font-size:31px;line-height:1.62;color:var(--ink2);max-width:1320px;margin:14px 0 0}
.ayah .ay-lead b{color:var(--key-deep)}
/* rules */
.rules{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:8px}
.rl-c{background:#fff;border:1.5px solid var(--line2);border-radius:20px;padding:26px 18px;text-align:center;box-shadow:0 6px 22px rgba(34,39,45,.07);position:relative;overflow:hidden}
.rl-c::before{content:'';position:absolute;inset-inline:0;top:0;height:5px;background:var(--key)}
.rl-c .ri{font-size:52px;line-height:1;margin-bottom:14px;display:block}
.rl-c .rt{font-size:31px;font-weight:800;color:var(--ink);line-height:1.3}
.rl-c .rs{font-size:26px;color:var(--ink3);margin-top:10px;line-height:1.5}
/* station cover */
.stcover{display:grid;grid-template-columns:1.12fr .88fr;align-items:center;height:100%;gap:60px;position:relative}
.stcover .sc-l{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.stcover .sc-n{font-family:var(--f-num);font-size:150px;font-weight:800;line-height:.9;color:var(--key);opacity:.9}
.stcover .sc-k{font-size:25px;font-weight:700;letter-spacing:.12em;color:var(--key-deep)}
.stcover .sc-t{font-family:var(--f-dis);font-size:78px;font-weight:800;line-height:1.14;color:var(--ink);margin:6px 0 0}
.stcover .sc-rule{width:110px;height:5px;border-radius:3px;background:var(--key);margin:22px 0 16px}
.stcover .sc-q{font-size:33px;line-height:1.55;color:var(--ink2);max-width:860px;margin:0}
.stcover .sc-q b{color:var(--key-deep)}
.stcover .sc-tool{margin-top:24px;display:inline-flex;align-items:center;gap:12px;font-size:27px;font-weight:700;background:var(--key-soft);border:2px solid var(--key-soft2);color:var(--key-deep);border-radius:16px;padding:14px 24px}
.stcover .sc-r{display:flex;align-items:center;justify-content:center}
/* figures */
.figwrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.fig{display:flex;align-items:center;justify-content:center;width:100%}
.fig svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(34,39,45,.14))}
.fig.s{max-width:230px}.fig.m{max-width:340px}.fig.l{max-width:470px}.fig.xl{max-width:560px}
.figwrap .fcap{font-size:26px;color:var(--ink3);font-weight:700;text-align:center;line-height:1.45;max-width:520px}
/* cards */
.grid{display:grid;gap:22px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{background:#fff;border:1.5px solid var(--line2);border-radius:20px;padding:26px 28px;box-shadow:0 6px 22px rgba(34,39,45,.06);position:relative}
.card .ci{font-size:46px;line-height:1;display:block;margin-bottom:10px}
.card .ct{font-size:34px;font-weight:800;color:var(--ink);line-height:1.3}
.card .cs{font-size:29px;color:var(--ink3);line-height:1.5;margin-top:8px}
.card.k{border-top:6px solid var(--key)}
.card .cn{position:absolute;left:22px;top:18px;font-size:30px;font-weight:800;color:var(--key);opacity:.5}
.split{display:grid;grid-template-columns:1.25fr .75fr;gap:60px;align-items:center}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:20px;align-items:center;background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:16px 22px;font-size:29px;line-height:1.45;color:var(--ink2)}
.step i{font-style:normal;flex:0 0 54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--key);color:#fff;font-weight:800;font-size:27px}
.step b{color:var(--ink)}
/* journey map */
.jmap{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:6px}
.jm-day{background:#fff;border:1.5px solid var(--line2);border-radius:22px;padding:22px 24px;box-shadow:0 6px 22px rgba(34,39,45,.06)}
.jm-day.muted{opacity:.55}
.jm-h{font-size:34px;font-weight:800;color:var(--key);border-bottom:3px solid var(--key-soft2);padding-bottom:8px;margin-bottom:10px}
.jm-h small{display:block;font-size:26px;color:var(--ink3);font-weight:700}
.jm-st{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:28px;line-height:1.35}
.jm-st i{font-style:normal;flex:0 0 42px;height:42px;border-radius:50%;background:var(--key-soft);color:var(--key-deep);display:grid;place-items:center;font-weight:800;font-size:24px}
.jm-st span{display:block;font-size:24px;color:var(--muted)}
/* ladder / gauge */
.ladder{display:flex;align-items:flex-end;gap:18px;height:520px}
.ladder .lv{flex:1;background:#fff;border:1.5px solid var(--line2);border-radius:18px 18px 8px 8px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;border-top:8px solid var(--key)}
.ladder .lv b{font-size:54px;color:var(--key);line-height:1}.ladder .lv p{font-size:28px;margin:8px 0 0;line-height:1.35;color:var(--ink2);font-weight:700}
.qrbox{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 36px rgba(34,39,45,.12);width:420px}
.qrbox svg{width:100%;height:auto}
.url{font-size:34px;font-weight:800;direction:ltr;color:var(--key-deep);margin-top:14px;text-align:center}
video.film{width:1500px;max-width:100%;aspect-ratio:16/9;border-radius:22px;background:#0b1530;box-shadow:0 20px 50px rgba(0,0,0,.25);display:block;margin:0 auto}
/* reveal */
.frag{opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s}
.frag.in{opacity:1;transform:none}
/* HUD */
#hud{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(251,248,244,.94);border-top:1px solid var(--line);font-size:14px;color:var(--ink3);z-index:150}
.navb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-size:16px;cursor:pointer;flex:none;font-family:var(--f-ar)}
.navb:hover{background:var(--key-soft);border-color:var(--key-soft2);color:var(--key-deep)}
.hn{font-weight:800;color:var(--key-deep);direction:ltr}
#hudU{font-weight:700}
#tools{position:fixed;inset-inline-end:14px;bottom:60px;display:flex;flex-direction:column;gap:6px;z-index:140;opacity:.42;transition:opacity .25s}
#tools:hover{opacity:1}
.tbtn{padding:6px 8px;font-size:13px;border-radius:9px;background:rgba(255,255,255,.85);border:1px solid rgba(226,217,205,.8);box-shadow:0 2px 7px rgba(34,39,45,.08);line-height:1;cursor:pointer;font-family:var(--f-ar)}
#guide{position:fixed;top:0;bottom:46px;inset-inline-start:0;width:520px;max-width:92vw;background:#fffdf9;border-inline-end:1px solid var(--line);box-shadow:8px 0 30px rgba(0,0,0,.15);z-index:160;overflow:auto;padding:18px 20px;font-size:15px;line-height:1.75;color:var(--ink2);display:none}
#guide.on{display:block}#guide h3{color:var(--key);margin:0 0 4px;font-size:19px}#guide h4{color:var(--key-deep);margin:14px 0 4px;font-size:15px}#guide ul{margin:0;padding-inline-start:18px}
#guide .meta{font-size:13px;color:var(--muted)}#guide .x{float:left;cursor:pointer;border:0;background:none;font-size:20px}
#idx{position:fixed;inset:0 0 46px;background:rgba(35,28,26,.92);z-index:170;overflow:auto;padding:30px;display:none;color:#fff}
#idx.on{display:block}#idx h3{color:#e7cfca;margin:18px 0 8px}#idx a{display:inline-block;color:#fff;background:rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;margin:3px;text-decoration:none;font-size:14px;cursor:pointer}
</style></head><body>
<div id="stage"><div id="deck"></div></div>
<div id="tools"><button class="tbtn" onclick="toggleIdx()">☰ الفهرس</button><button class="tbtn" onclick="toggleGuide()">📘 دليل المدرب</button><button class="tbtn" onclick="fs()">⛶ ملء الشاشة</button></div>
<div id="guide"></div><div id="idx"></div>
<div id="hud"><button class="navb" onclick="prev()" title="السابقة">▶</button><button class="navb" onclick="next()" title="التالية">◀</button>
<span class="hn"><span id="hudN">1</span> / <span id="hudT">1</span></span><span id="hudU"></span>
<span style="margin-inline-start:auto">د. إبراهيم شوقي · ايفوري للتدريب والاستشارات × منصة طموح</span></div>
<script>'use strict';
const META = [], TG = {}, ERR = [], SLIDES = [];
const ARCS = '<div class="arcs"><i></i><i></i><i></i></div>';
const WM = n => `<div class="wm">${n}</div>`;
const K = '#7A2E2E', KS = '#e7cfca', A = '#a8894e';
const ART = {
  compass: `<svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="160" fill="#fff" stroke="${K}" stroke-width="10"/><circle cx="200" cy="200" r="120" fill="none" stroke="${KS}" stroke-width="4" stroke-dasharray="6 10"/><path d="M200 70 L232 200 L200 330 L168 200Z" fill="${K}" opacity=".9"/><path d="M200 70 L232 200 L168 200Z" fill="${A}"/><circle cx="200" cy="200" r="14" fill="#fff" stroke="${K}" stroke-width="6"/></svg>`,
  people: `<svg viewBox="0 0 400 400"><circle cx="200" cy="140" r="56" fill="#fff" stroke="${K}" stroke-width="10"/><path d="M100 330c0-60 45-100 100-100s100 40 100 100" fill="#fff" stroke="${K}" stroke-width="10"/><circle cx="90" cy="180" r="36" fill="${KS}"/><circle cx="310" cy="180" r="36" fill="${KS}"/><path d="M30 320c0-40 28-66 60-66M370 320c0-40-28-66-60-66" fill="none" stroke="${A}" stroke-width="8" stroke-linecap="round"/></svg>`,
  film: `<svg viewBox="0 0 400 400"><rect x="40" y="90" width="320" height="220" rx="28" fill="#fff" stroke="${K}" stroke-width="10"/><path d="M175 150 L265 200 L175 250Z" fill="${K}"/><g fill="${KS}"><rect x="60" y="108" width="22" height="22" rx="5"/><rect x="60" y="270" width="22" height="22" rx="5"/><rect x="318" y="108" width="22" height="22" rx="5"/><rect x="318" y="270" width="22" height="22" rx="5"/></g><path d="M120 340h160" stroke="${A}" stroke-width="8" stroke-linecap="round"/></svg>`,
  spark: `<svg viewBox="0 0 400 400"><g stroke="${K}" stroke-width="22" stroke-linecap="round">${[0,30,60,90,120,150].map(a=>`<line x1="200" y1="60" x2="200" y2="340" transform="rotate(${a} 200 200)"/>`).join('')}</g><circle cx="200" cy="200" r="38" fill="#fff" stroke="${A}" stroke-width="8"/></svg>`,
  tools: `<svg viewBox="0 0 400 400"><rect x="60" y="60" width="130" height="130" rx="26" fill="#fff" stroke="${K}" stroke-width="10"/><rect x="210" y="60" width="130" height="130" rx="26" fill="${KS}"/><rect x="60" y="210" width="130" height="130" rx="26" fill="${KS}"/><rect x="210" y="210" width="130" height="130" rx="26" fill="#fff" stroke="${K}" stroke-width="10"/><circle cx="125" cy="125" r="26" fill="${A}"/><path d="M245 275h60M275 245v60" stroke="${K}" stroke-width="12" stroke-linecap="round"/></svg>`,
  tasks: `<svg viewBox="0 0 400 400"><rect x="80" y="50" width="240" height="300" rx="26" fill="#fff" stroke="${K}" stroke-width="10"/>${[0,1,2].map(i=>`<rect x="115" y="${105+i*75}" width="34" height="34" rx="8" fill="${i<2?K:'#fff'}" stroke="${K}" stroke-width="6"/><path d="M170 ${122+i*75}h110" stroke="${i<2?KS:A}" stroke-width="12" stroke-linecap="round"/>`).join('')}</svg>`,
  lens: `<svg viewBox="0 0 400 400"><circle cx="170" cy="170" r="110" fill="#fff" stroke="${K}" stroke-width="12"/><path d="M250 250 L350 350" stroke="${K}" stroke-width="30" stroke-linecap="round"/><path d="M110 170h120M110 135h80M110 205h100" stroke="${KS}" stroke-width="12" stroke-linecap="round"/><circle cx="230" cy="130" r="12" fill="${A}"/></svg>`,
  gauge: `<svg viewBox="0 0 400 400"><path d="M60 270 A140 140 0 0 1 340 270" fill="none" stroke="${KS}" stroke-width="34" stroke-linecap="round"/><path d="M60 270 A140 140 0 0 1 318 190" fill="none" stroke="${K}" stroke-width="34" stroke-linecap="round"/><path d="M200 270 L300 175" stroke="${A}" stroke-width="12" stroke-linecap="round"/><circle cx="200" cy="270" r="18" fill="${K}"/><text x="200" y="350" text-anchor="middle" font-size="54" font-weight="800" fill="${K}" font-family="Almarai">95%</text></svg>`,
  pack: `<svg viewBox="0 0 400 400"><path d="M200 50 L340 120 L340 280 L200 350 L60 280 L60 120Z" fill="#fff" stroke="${K}" stroke-width="10" stroke-linejoin="round"/><path d="M60 120 L200 190 L340 120M200 190V350" fill="none" stroke="${K}" stroke-width="10" stroke-linejoin="round"/><path d="M130 85 L270 155" stroke="${A}" stroke-width="12"/></svg>`,
  clock: `<svg viewBox="0 0 400 400"><circle cx="200" cy="210" r="140" fill="#fff" stroke="${K}" stroke-width="10"/><path d="M200 210V120M200 210l70 40" stroke="${K}" stroke-width="14" stroke-linecap="round"/><path d="M160 50h80" stroke="${A}" stroke-width="16" stroke-linecap="round"/><circle cx="200" cy="210" r="12" fill="${A}"/></svg>`,
  flag: `<svg viewBox="0 0 400 400"><path d="M110 360V50" stroke="${K}" stroke-width="14" stroke-linecap="round"/><path d="M118 60h180l-40 60 40 60H118Z" fill="${K}"/><circle cx="110" cy="360" r="20" fill="${A}"/></svg>`
};
const FIG = (key, cap, size = 'l') => `<div class="figwrap"><div class="fig ${size}">${ART[key] || ''}</div>${cap ? `<div class="fcap">${cap}</div>` : ''}</div>`;
const FRAG_SEL = '.anim,.card,.rl-c,.step,.jm-day,.lv';
function add(unit, title, html) {
  if (META.some(m => m.unit === unit && m.title === title)) ERR.push('dup:' + title);
  META.push({ unit, title }); SLIDES.push(html);
}
function G(title, o) { if (TG[title]) ERR.push('dupG:' + title); TG[title] = o; }
const sKey = i => META[i].unit + '|' + META[i].title;
let cur = 0, frags = [], fi = 0;
function build() {
  const deck = document.getElementById('deck');
  deck.innerHTML = SLIDES.join('');
  const ss = deck.querySelectorAll('.slide');
  if (ss.length !== META.length) ERR.push('count');
  META.forEach((m, i) => {
    if (!TG[m.title]) ERR.push('noGuide:' + m.title);
    else if (i > 0 && TG[META[i - 1].title]) { const g = TG[m.title], p = TG[META[i - 1].title]; g.arc = g.arc || {}; if (!g.arc.w) g.arc.w = p.arc && p.arc.s; if (g.arc.w !== (p.arc && p.arc.s)) ERR.push('chain:' + m.title); }
  });
  ss.forEach(s => { const w = document.createTreeWalker(s, NodeFilter.SHOW_TEXT); const ns = []; while (w.nextNode()) if (/\d+%/.test(w.currentNode.nodeValue)) ns.push(w.currentNode);
    ns.forEach(n => { const sp = document.createElement('span'); sp.innerHTML = n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(\d+%)/g, '<span dir="ltr">$1</span>'); n.replaceWith(...sp.childNodes); }); });
  ss.forEach(s => { if (s.dataset.immediate !== '1') s.querySelectorAll(FRAG_SEL).forEach(e => e.classList.add('frag')); });
  document.getElementById('hudT').textContent = META.length;
  const ix = document.getElementById('idx'); let lu = '';
  ix.innerHTML = META.map((m, i) => (m.unit !== lu ? `<h3>${(lu = m.unit)}</h3>` : '') + `<a data-go="${i}">${i + 1}. ${m.title}</a>`).join('');
  ix.onclick = e => { const a = e.target.closest('[data-go]'); if (a) { show(+a.dataset.go); ix.classList.remove('on'); } };
  fit(); window.addEventListener('resize', fit);
  const h = parseInt((location.hash || '').slice(1)); show(isNaN(h) ? 0 : Math.max(0, Math.min(META.length - 1, h - 1)));
}
function fit() { const s = Math.min(innerWidth / 1920, (innerHeight - 46) / 1080); const d = document.getElementById('deck'); d.style.transform = `scale(${s})`; document.getElementById('stage').style.bottom = '46px'; }
function show(n) {
  const ss = document.querySelectorAll('.slide'); ss.forEach(s => s.classList.remove('on'));
  cur = Math.max(0, Math.min(ss.length - 1, n)); const s = ss[cur]; s.classList.add('on');
  frags = [...s.querySelectorAll('.frag')]; frags.forEach(f => f.classList.remove('in')); fi = 0;
  document.getElementById('hudN').textContent = cur + 1; document.getElementById('hudU').textContent = META[cur].unit;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  s.querySelectorAll('video').forEach(v => {}); document.querySelectorAll('.slide:not(.on) video').forEach(v => { try { v.pause(); } catch (e) {} });
  renderGuide();
}
function revealAll(s) { (s || document.querySelector('.slide.on')).querySelectorAll('.frag').forEach(f => f.classList.add('in')); fi = frags.length; }
function next() { if (fi < frags.length) { frags[fi++].classList.add('in'); } else if (cur < META.length - 1) show(cur + 1); }
function prev() { if (cur > 0) { show(cur - 1); revealAll(); } }
function renderGuide() {
  const g = TG[META[cur].title] || {}, a = g.arc || {}; const L = x => (x || []).map(i => `<li>${i}</li>`).join('');
  document.getElementById('guide').innerHTML = `<button class="x" onclick="toggleGuide()">×</button><h3>${cur + 1}. ${META[cur].title}</h3><div class="meta">${g.role || ''} · ${g.t || ''}</div>
  <h4>لماذا هذه الشريحة</h4><p>${g.why || ''}</p><h4>قوس الحلقة</h4><ul><li><b>وارث:</b> ${a.w || '—'}</li><li><b>جواب:</b> ${a.a || ''}</li><li><b>بذرة:</b> ${a.s || ''}</li><li><b>وصلة:</b> ${a.l || ''}</li></ul>
  <h4>الشرح المعمّق</h4><p>${g.deep || ''}</p><h4>السند المنهجي</h4><ul>${L(g.base)}</ul><h4>ماذا أقول</h4><ul>${L(g.say)}</ul><h4>كيف أدير</h4><ul>${L(g.run)}</ul><h4>تحذيرات وماذا لو</h4><ul>${L(g.warn)}</ul><h4>سؤال التحقق</h4><p>${g.check || ''}</p>`;
}
function toggleGuide() { document.getElementById('guide').classList.toggle('on'); }
function toggleIdx() { document.getElementById('idx').classList.toggle('on'); }
function fs() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'VIDEO') return;
  if (['ArrowLeft', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowRight', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'g') toggleGuide(); else if (e.key === 'i') toggleIdx(); else if (e.key === 'f') fs();
});

gd('حقوق الملكية الفكرية', { t: 'دقيقة', role: 'افتتاح · إجرائي', why: 'تثبيت الحقوق في بداية البرنامج، مع التفريق الصريح بين مادة ايفوري وما يبنيه المشارك لنفسه، حتى لا يتردد في استخدام حزمه في عمله.',

gd('المنصة والمختبر', { t: '8 دقائق', role: 'افتتاح · تجهيز', why: 'كل ما بعد هذه الشريحة يتم على جهاز المشارك؛ فإن لم يدخل المختبر وحسابه على Claude الآن، سيتأخر عن المحطات كلها.',
  a: 'المشاركون داخل المنصة والمختبر وClaude', s: 'الآن والمختبر مفتوح… من أنت وما مهمتك؟', l: 'الكل في المختبر؟ أول ما سيطلبه منك أن يعرف من أنت.',
  deep: 'نفّذ الخطوات معهم خطوة خطوة ولا تنتقل حتى يرفع الجميع أيديهم. الاختبار القبلي يُعبّأ بصدق؛ هدفه قياس نقطة الانطلاق لا التقييم. المختبر يعمل من الجوال والحاسوب، والأفضل الحاسوب لأن اليوم الثاني فيه كتابة كثيرة. أكّد أن ما يكتبه المشارك في المختبر يبقى على جهازه ولا يظهر لزملائه أو على شاشة القاعة. مثال افتراضي: رئيس تنفيذي يتردد في كتابة مهامه أمام موظفين من جهات أخرى؛ طمئنه بأن المختبر شخصي تمامًا. إن لم يكن لدى أحد حساب على Claude فساعده في إنشائه الآن، ويفضّل اشتراك Pro لأن المشاريع والمهارات تعمل بكامل قدرتها فيه.',
  base: ['جاهزية البيئة التعليمية قبل المحتوى'],
  say: ['لن نبدأ حتى يدخل الجميع.', 'ما تكتبه في المختبر لا يراه غيرك.', 'أبقِ المختبر وClaude مفتوحين جنبًا إلى جنب.'],
  run: ['امنح خمس دقائق للتسجيل والاختبار القبلي.', 'تجوّل وساعد من تعثّر.', 'تحقق برفع الأيدي.'],
  warn: ['ماذا لو لم يملك مشارك حسابًا مدفوعًا؟ الحساب المجاني يكفي لليوم الأول، والمشاريع متاحة فيه بحدود.', 'ماذا لو تعطّل الإنترنت؟ شارك نقطة اتصال الجوال.'],
  check: 'هل المختبر وClaude مفتوحان على كل جهاز؟' });

 'ختام اليوم الثاني': 'وقبل أن يغادروا، ذكّرهم بأن الحزم في حساباتهم الآن ويمكنهم تشغيلها في أي وقت، وأن المختبر يحفظ نسخهم وتقدمهم على الجهاز نفسه. وإن كان لديك وقت فاطلب من مشارك واحد أن يقارن بين أول درجة حصل عليها في ورشة التدقيق وآخر درجة؛ هذا الرقم يلخص اليوم الثاني كله.'
